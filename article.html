<!DOCTYPE html>
<html lang="en">
<!-- gispl:no-shell — redirect stub, deliberately carries no header/footer. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Redirecting — GISPL Insights</title>
<!--
  Articles moved from /article.html?slug=X to /insights/X/.

  This stub exists because a CDN cannot do that redirect: on S3/CloudFront the
  query string plays no part in object selection, so ?slug=X never reaches the
  edge as something a per-slug rule could match. The redirect has to happen
  where the query string is visible — in the browser.

  It also means the migration is correct before any CDN config exists, and
  stays correct if that config is ever detached.
-->
<link rel="canonical" href="https://gispl.co/insights/">
<style>body{margin:0;font:400 16px/1.6 system-ui,sans-serif;color:#33405C;background:#fff;
display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
a{color:#C4632A}</style>
</head>
<body>
<main>
  <p>Taking you to the article&hellip;</p>
  <p><a id="fallback" href="insights/">Continue to Insights &rarr;</a></p>
</main>
<script>
(function () {
  "use strict";
  var slug = (new URLSearchParams(location.search).get("slug") || "").trim();
  // Only ever redirect to our own path. An unvalidated slug interpolated into
  // a URL is an open-redirect; "//evil.com" would otherwise become a
  // protocol-relative absolute URL.
  var target = /^[a-z0-9][a-z0-9-]{0,80}$/.test(slug)
    ? "insights/" + slug + "/"
    : "insights/";
  var link = document.getElementById("fallback");
  if (link) link.setAttribute("href", target);
  location.replace(target);
})();
</script>
</body>
</html>
