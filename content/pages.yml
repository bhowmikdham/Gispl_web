# The hand-maintained pages, as data.
#
# One list, three consumers: the sitemap, the site-search index, and
# scripts/apply-page-seo.py (which stamps canonical/og/JSON-LD into each file).
# Before this, the search index was a separate hand-written array in site.js
# that covered 12 of 15 pages — adding a page and forgetting to index it was
# silent. check-content.py now fails when a shipped page is missing here.
#
# `path` is the served URL. `nav` marks which top-level nav item highlights.
# `schema` picks the extra JSON-LD block, beyond Organization + Breadcrumbs.

- path: /
  file: index.html
  title: Home
  nav: null
  breadcrumb: Home
  schema: website
