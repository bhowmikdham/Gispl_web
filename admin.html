<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GISPL Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#EEF1F5; color:#0B1E3B; font-family:'IBM Plex Sans',sans-serif; }
  a { color:#F26A21; }
  .adm-top { display:flex; align-items:center; justify-content:space-between; background:#07142B; color:#fff; padding:0 26px; height:60px; }
  .adm-brand { display:flex; align-items:center; gap:12px; font:700 18px Archivo; }
  .adm-badge { font:500 10px 'IBM Plex Mono'; letter-spacing:.14em; color:#F4915A; border:1px solid rgba(244,145,90,.5); padding:3px 8px; border-radius:20px; }
  .adm-who { font:500 13px 'IBM Plex Sans'; color:rgba(255,255,255,.75); display:flex; align-items:center; gap:14px; }
  .adm-btn { border:none; background:#F26A21; color:#fff; font:600 14px 'IBM Plex Sans'; padding:10px 16px; border-radius:8px; cursor:pointer; }
  .adm-btn.ghost { background:transparent; border:1px solid rgba(11,30,59,.2); color:#0B1E3B; }
  .adm-btn.subtle { background:#fff; border:1px solid rgba(11,30,59,.18); color:#0B1E3B; }
  .adm-btn.danger { background:#fff; border:1px solid rgba(192,57,43,.4); color:#C0392B; }
  .adm-btn:disabled { opacity:.5; cursor:default; }
  .adm-tabs { display:flex; gap:4px; background:#0A1A30; padding:0 26px; }
  .adm-tab { color:rgba(255,255,255,.7); font:500 14px 'IBM Plex Sans'; padding:13px 16px; cursor:pointer; border-bottom:2px solid transparent; }
  .adm-tab.on { color:#fff; border-bottom-color:#F26A21; }
  .adm-wrap { max-width:1120px; margin:26px auto; padding:0 26px; }
  .adm-card { background:#fff; border:1px solid rgba(11,30,59,.08); border-radius:14px; padding:22px 24px; margin-bottom:18px; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font:500 11px 'IBM Plex Mono'; letter-spacing:.08em; color:#8A92A4; text-transform:uppercase; padding:0 12px 10px; }
  td { padding:12px; border-top:1px solid rgba(11,30,59,.08); font:500 14px 'IBM Plex Sans'; vertical-align:middle; }
  label { display:block; font:500 11px 'IBM Plex Mono'; letter-spacing:.06em; color:#5B647C; text-transform:uppercase; margin:0 0 5px; }
  input, select, textarea { width:100%; border:1px solid rgba(11,30,59,.18); border-radius:8px; padding:10px 11px; font:500 14px 'IBM Plex Sans'; color:#0B1E3B; background:#fff; }
  textarea { resize:vertical; }
  .field { margin-bottom:14px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .pill { font:500 10px 'IBM Plex Mono'; letter-spacing:.06em; padding:4px 9px; border-radius:20px; display:inline-block; }
  .muted { color:#8A92A4; font:500 13px 'IBM Plex Sans'; }
  h2.sec { font:700 20px Archivo; margin:0 0 4px; }
  .modal-bg { position:fixed; inset:0; background:rgba(7,20,43,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; z-index:100; }
  .modal { background:#fff; border-radius:16px; padding:26px 28px; width:100%; max-width:640px; }
</style>
</head>
<body>
<div class="adm-top">
  <div class="adm-brand">GISPL <span class="adm-badge">ADMIN</span></div>
  <div class="adm-who" id="who" style="display:none">
    <span id="whoEmail"></span>
    <button class="adm-btn ghost" id="signOut" style="color:#fff;border-color:rgba(255,255,255,.3)">Sign out</button>
  </div>
</div>
<div class="adm-tabs" id="tabs" style="display:none">
  <div class="adm-tab on" data-tab="jobs">Jobs</div>
  <div class="adm-tab" data-tab="posts">Blog posts</div>
  <div class="adm-tab" data-tab="apps">Applications</div>
  <div class="adm-tab" data-tab="templates">Email templates</div>
</div>
<div class="adm-wrap"><div id="view"></div></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
