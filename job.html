<!DOCTYPE html>
<html lang="en">
<!-- gispl:no-shell — redirect stub, deliberately carries no header/footer. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Redirecting — GISPL Careers</title>
<!--
  Roles moved from /job.html?slug=X to /careers/roles/X/.
  See article.html for why this cannot be a CDN redirect.
-->
<link rel="canonical" href="https://gispl.co/careers/roles/">
<style>body{margin:0;font:400 16px/1.6 system-ui,sans-serif;color:#33405C;background:#fff;
display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
a{color:#C4632A}</style>
</head>
<body>
<main>
  <p>Taking you to the role&hellip;</p>
  <p><a id="fallback" href="careers/roles/">Continue to open roles &rarr;</a></p>
</main>
<script>
(function () {
  "use strict";
  var slug = (new URLSearchParams(location.search).get("slug") || "").trim();
  var target = /^[a-z0-9][a-z0-9-]{0,80}$/.test(slug)
    ? "careers/roles/" + slug + "/"
    : "careers/roles/";
  var link = document.getElementById("fallback");
  if (link) link.setAttribute("href", target);
  location.replace(target);
})();
</script>
</body>
</html>
